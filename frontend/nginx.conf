server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 2 MB by the backend; let slightly more through so the
    # backend (not nginx) answers with its 413 JSON error.
    client_max_body_size 3m;

    # API calls go to the backend container. "backend" is its service name in
    # docker-compose.yml; Compose's internal DNS resolves it.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Angular routes (/scans/7, /policy) are handled in the browser: serve index.html
    # for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
