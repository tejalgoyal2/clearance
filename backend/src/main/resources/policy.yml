# Clearance licence policy.
#
# Every licence identifier is an SPDX id (https://spdx.org/licenses/).
# Matching is case-insensitive. A licence may appear in only one list:
# the application refuses to start otherwise.

approved:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Unlicense

review:
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MPL-2.0
  - EPL-2.0
  - CDDL-1.0

denied:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0

# Names found in the wild (pom.xml <licenses>, old npm packages) mapped to SPDX ids.
# A whole licence string is checked against these before it is parsed, so
# aliases may contain spaces and commas.
aliases:
  "Apache 2.0": Apache-2.0
  "Apache-2": Apache-2.0
  "Apache License 2.0": Apache-2.0
  "Apache License, Version 2.0": Apache-2.0
  "The Apache License, Version 2.0": Apache-2.0
  "The Apache Software License, Version 2.0": Apache-2.0
  "ASL 2.0": Apache-2.0
  "MIT License": MIT
  "The MIT License": MIT
  "BSD 2-Clause": BSD-2-Clause
  "BSD 3-Clause": BSD-3-Clause
  "New BSD License": BSD-3-Clause
  "Eclipse Public License 2.0": EPL-2.0
  "Eclipse Public License - v 2.0": EPL-2.0
  "Mozilla Public License 2.0": MPL-2.0
  # Deprecated SPDX ids that are still common in package metadata.
  "GPL-2.0": GPL-2.0-only
  "GPL-2.0+": GPL-2.0-or-later
  "GPL-3.0": GPL-3.0-only
  "GPL-3.0+": GPL-3.0-or-later
  "LGPL-2.1": LGPL-2.1-only
  "LGPL-3.0": LGPL-3.0-only
  "AGPL-3.0": AGPL-3.0-only

# Full "X WITH Y" expressions that get their own verdict.
# Any other "X WITH Y" falls back to the verdict for X.
exceptions:
  "GPL-2.0-only WITH Classpath-exception-2.0": REVIEW
  "GPL-2.0-only WITH Universal-FOSS-exception-1.0": REVIEW
