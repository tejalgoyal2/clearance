# Start everything with:  docker compose up --build
# Then open http://localhost:8080

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clearance
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: clearance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance -d clearance"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clearance
      SPRING_DATASOURCE_USERNAME: clearance
      SPRING_DATASOURCE_PASSWORD: clearance
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy   # nginx only starts once the API is up
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
